plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.colortube.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.colortube.game"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
        buildConfig true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Google Mobile Ads (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    // Meta Audience Network Mediation Adapter & SDK
    implementation 'com.google.ads.mediation:facebook:6.19.0.0'
    // Unity Ads Mediation Adapter & SDK
    implementation 'com.unity3d.ads:unity-ads:4.13.1'
    implementation 'com.google.ads.mediation:unity:4.13.1.0'
    
    testImplementation 'junit:junit:4.13.2'
}
