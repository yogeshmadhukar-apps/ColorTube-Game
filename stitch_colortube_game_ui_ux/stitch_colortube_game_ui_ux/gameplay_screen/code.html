<script>
  let selectedTubeId = 'tube-1';
  let moves = 14;

  function toggleTube(id) {
    const prevEl = document.getElementById(selectedTubeId);
    const newEl = document.getElementById(id);
    
    if (selectedTubeId === id) {
      // Deselect
      prevEl.classList.remove('-translate-y-3');
      const glow = prevEl.querySelector('.bg-primary-container\\/25');
      if (glow) glow.remove();
      selectedTubeId = null;
      return;
    }

    if (selectedTubeId && selectedTubeId !== id) {
      // Simulate Pouring Action / Increment Move
      moves++;
      const moveCountEl = document.getElementById('moveCount');
      if (moveCountEl) moveCountEl.textContent = moves;

      // Reset previous
      if (prevEl) {
        prevEl.classList.remove('-translate-y-3');
        const prevGlow = prevEl.querySelector('.bg-primary-container\\/25');
        if (prevGlow) prevGlow.remove();
      }

      // Quick visual bump on receiver
      newEl.classList.add('scale-105');
      setTimeout(() => newEl.classList.remove('scale-105'), 200);

      selectedTubeId = null;
      return;
    }

    // Select new
    selectedTubeId = id;
    newEl.classList.add('-translate-y-3');
  }

  function handleAction(type) {
    if (type === 'Reset') {
      moves = 0;
      const moveCountEl = document.getElementById('moveCount');
      if (moveCountEl) moveCountEl.textContent = moves;
    }
  }
</script></main>
