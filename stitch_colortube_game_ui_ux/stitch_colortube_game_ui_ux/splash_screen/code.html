tline": "#6b7a7a", "surface-container": "#eaedff" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-md": "0.75rem", "space-xl": "2rem", "gutter": "1rem", "space-xs": "0.25rem", "space-lg": "1.25rem", "margin": "1.25rem" }, fontFamily: { "display-lg-mobile": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-md": ["Inter"], "label-sm": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "label-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}], "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600"}], "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}], "label-sm": ["10px", {"lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "700"}], "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800"}], "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "500"}], "label-lg": ["14px", {"lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "700"}], "headline-sm": ["18px", {"lineHeight": "26px", "letterSpacing": "0", "fontWeight": "600"}], "headline-md": ["22px", {"lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "700"}], "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary-container"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full relative overflow-hidden select-none px-margin py-space-xl justify-between items-center min-h-[92vh]">

<div class="absolute top-1/3 right-4 w-40 h-40 rounded-full bg-tertiary-container/15 blur-2xl"></div>
<div class="absolute bottom-1/4 left-6 w-52 h-52 rounded-full bg-primary-fixed-dim/20 blur-3xl"></div>

<div class="absolute top-16 left-12 w-6 h-6 rounded-full bg-surface-container-lowest/80 shadow-md backdrop-blur-md animate-bounce" style="animation-duration: 4s;"></div>
<div class="absolute top-28 right-14 w-4 h-4 rounded-full bg-primary-container/40 shadow-sm backdrop-blur-sm animate-pulse" style="animation-duration: 3s;"></div>
<div class="absolute bottom-48 right-10 w-8 h-8 rounded-full bg-surface-container-lowest/60 shadow-lg backdrop-blur-md animate-bounce" style="animation-duration: 5s;"></div>
<div class="absolute top-1/2 left-8 w-3 h-3 rounded-full bg-tertiary-fixed-dim/50 shadow-sm"></div>

<div class="relative z-10 w-full flex justify-center items-center pt-space-md">

<div class="relative z-10 flex flex-col items-center justify-center my-auto w-full max-w-xs text-center">

<div class="absolute w-56 h-56 rounded-full bg-gradient-to-tr from-primary-fixed-dim/40 via-surface-container-lowest/90 to-tertiary-fixed/30 blur-md transform scale-105"></div>
<!-- Official App Logo Display with Deep Gloss Specular Reflection -->
<div class="relative w-44 h-44 rounded-full p-2 bg-surface-container-lowest/70 backdrop-blur-xl shadow-xl flex items-center justify-center">
<img alt="ColorTube game icon showing glowing chromatic laboratory tubes with smooth liquid" class="w-full h-full object-cover rounded-full shadow-inner transform transition-transform duration-700 hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwtcE89_oivstzvGkV3Wp5iO964gc0yi6wf9nIdl3B390LFTFW8A8aVDhZV1HPVr_ks6CPTVnZkfHjCGfCH52lVD7bEJXy_mgqVrghJpacGNpR7tvolZbC-1B51AgTf5-EHgz_jHd1iZuVGSZfWttx0W_YGrdekb80ud2yrnIDBL3tmC5jdlkeO7wlik_n5jAufsVcKkFQIjMdbXPiWI8d8nGy2fkNxBbJd4HMnMIlYD78kwLBdwurtA"/>

<div class="flex flex-col items-center gap-space-xs">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight flex items-center">

<!-- Mini Ambient Mode Indicator -->
<div class="mt-space-md flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/60">
<span class="material-symbols-outlined text-primary text-base" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Kinetic Liquid Physics</span>
</div>
</div>

<div class="relative z-10 w-full max-w-sm flex flex-col items-center gap-space-md pb-space-sm">
<!-- Progress Pill Container with Translucent Refraction -->
<div class="w-full bg-surface-container-lowest/80 backdrop-blur-xl rounded-full p-1.5 shadow-md flex flex-col gap-1">
<div class="relative w-full h-3.5 bg-surface-container rounded-full overflow-hidden">
<!-- Glowing Cyan-to-Teal Fluid Fill (78% simulated) -->
<div class="h-full rounded-full bg-gradient-to-r from-primary-container via-primary-fixed-dim to-primary transition-all duration-1000 ease-out shadow-sm" id="loading-bar-fill" style="width: 78%;"></div>
<!-- High-gloss liquid top shine reflection -->
<div class="absolute inset-x-0 top-0 h-[40%] bg-surface-container-lowest/40 rounded-t-full pointer-events-none"></div>
</div>
</div>
<!-- Loading Status Readout -->
<div class="w-full flex justify-between items-center px-space-xs text-on-surface-variant">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md" id="loading-status-text">Loading ambient assets...</span>
</div>
<span class="font-label-md text-label-md text-primary font-bold" id="loading-percent-text">78%</span>
</div>
<!-- Meta Information / Studio Signature -->
<div class="flex flex-col items-center gap-0.5 pt-space-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant/70 tracking-widest uppercase">
        v1.4.0 • Android Edition
      </span>
<span class="font-label-sm text-label-sm text-on-surface-variant/50">
        Aura Labs • Handcrafted Zen
      </span>
</div>
</div>
</div>
<script>
  (function() {
    const fill = document.getElementById('loading-bar-fill');
    const percentText = document.getElementById('loading-percent-text');
    const statusText = document.getElementById('loading-status-text');
    
    if (!fill || !percentText) return;

    let current = 78;
    const stages = [
      { threshold: 85, text: 'Calibrating tube acoustics...' },
      { threshold: 94, text: 'Warming fluid dynamics...' },
      { threshold: 100, text: 'Ready to pour' }
    ];

    const timer = setInterval(() => {
      if (current < 100) {
        current += Math.floor(Math.random() * 4) + 1;
        if (current > 100) current = 100;
        
        fill.style.width = current + '%';
        percentText.textContent = current + '%';

        const stage = stages.find(s => current <= s.threshold);
        if (stage && statusText) {
          statusText.textContent = stage.text;
        }

        if (current === 100) {
          clearInterval(timer);
        }
      }
    }, 280);
  })();
</script></main></body></html>
